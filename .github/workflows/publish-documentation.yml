# This workflow builds the Sphinx documentation and deploys it to GitHub Pages.
#
# MODIFIED in this build: upstream deploys on every push to main and on every
# release. Here GitHub Pages serves the solver speed-up report instead
# (index.html at the repository root, Pages source = branch/main, build_type =
# legacy), while sphinx-notes/pages requires the Pages source to be "GitHub
# Actions". The two cannot own the same site, so automatic deployment is
# disabled; run this workflow manually if you want the Sphinx docs published
# (that requires switching the Pages source to "GitHub Actions" first).
# See NOTICE.md.

name: Publish documentation

on:
    workflow_dispatch:

jobs:
    pages:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        steps:
            - id: deployment
              uses: sphinx-notes/pages@v3
